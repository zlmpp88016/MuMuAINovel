[project]
name = "book-analyzer"
version = "0.1.0"
description = "Independent TXT book analysis service for MuMuAINovel workspace."
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.72,<1.0",
    "chardet>=4.0,<6.0",
    "chromadb>=1.3.2,<2.0",
    "fastapi>=0.121,<1.0",
    "httpx>=0.28,<1.0",
    "mcp>=1.21,<2.0",
    "openai>=2.7,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "python-dotenv>=1.0,<2.0",
    "python-multipart>=0.0.20,<1.0",
    "sentence-transformers>=5.1.2,<6.0",
    "sqlalchemy>=2.0,<3.0",
    "pydantic>=2.10,<3.0",
    "uvicorn>=0.30,<1.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "httpx>=0.28,<1.0"
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: 需要真实 LLM API 连接的集成测试，CI 中用 -m \"not integration\" 跳过",
]
